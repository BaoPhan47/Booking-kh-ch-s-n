<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập & Đăng ký</title>
  <link rel="stylesheet" href="/login/styles.css">
</head>
<body>
  <div class="form-container">
    <!-- Form Đăng nhập -->
    <div class="form-box" id="login-form">
      <h2>Đăng Nhập</h2>
      <form>
        <div class="input-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" placeholder="Nhập email của bạn" required>
        </div>
        <div class="input-group">
          <label for="login-password">Mật khẩu</label>
          <input type="password" id="login-password" name="password" placeholder="Nhập mật khẩu" required>
        </div>
        <button type="submit" class="btn">Đăng nhập</button>
        <p>Chưa có tài khoản? <a href="#" onclick="showRegisterForm()">Đăng ký ngay</a></p>
      </form>
    </div>

    <!-- Form Đăng ký -->
    <div class="form-box" id="register-form" style="display: none;">
      <h2>Đăng Ký</h2>
      <form>
        <div class="input-group">
          <label for="register-name">Họ và Tên</label>
          <input type="text" id="register-name" name="name" placeholder="Nhập họ và tên" required>
        </div>
        <div class="input-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" name="email" placeholder="Nhập email của bạn" required>
        </div>
        <div class="input-group">
          <label for="register-password">Mật khẩu</label>
          <input type="password" id="register-password" name="password" placeholder="Nhập mật khẩu" required>
        </div>
        <div class="input-group">
          <label for="register-confirm-password">Xác nhận mật khẩu</label>
          <input type="password" id="register-confirm-password" name="confirm-password" placeholder="Xác nhận mật khẩu" required>
        </div>
        <button type="submit" class="btn">Đăng ký</button>
        <p>Đã có tài khoản? <a href="#" onclick="showLoginForm()">Đăng nhập ngay</a></p>
      </form>
    </div>
  </div>

  <script src="/login/app.js"></script>
</body>
</html>
